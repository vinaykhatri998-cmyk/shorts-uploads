name: Upload next Short to YouTube

on:
  schedule:
    - cron: "53 2,10 * * *"   # 8:23 AM and 4:23 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: videos
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upload the next queued Short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pipeline/yt_upload.py
      - name: Save the queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add how-it-evolved/ready/QUEUE.md
          git diff --cached --quiet || { git commit -m "Mark Short posted [skip ci]"; git push; }
